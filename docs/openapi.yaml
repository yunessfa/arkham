components:
  schemas:
    Address:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        recipient:
          type: string
          maxLength: 120
        phone:
          type: string
          pattern: ^09[0-9]{9}$
          maxLength: 11
        province:
          type: string
          maxLength: 80
        city:
          type: string
          maxLength: 80
        street:
          type: string
          maxLength: 600
        postal_code:
          type: string
          pattern: ^[0-9]{10}$
          maxLength: 10
      required:
      - city
      - id
      - phone
      - postal_code
      - province
      - recipient
      - street
    Article:
      type: object
      properties:
        title:
          type: string
          maxLength: 180
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        excerpt:
          type: string
          maxLength: 300
        body:
          type: string
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - body
      - slug
      - title
      - updated_at
    ArticleManagement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 180
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        excerpt:
          type: string
          maxLength: 300
        body:
          type: string
        published:
          type: boolean
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - body
      - id
      - slug
      - title
      - updated_at
    AuditLogManagement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        action:
          type: string
          maxLength: 100
        object_type:
          type: string
          maxLength: 80
        object_id:
          type: string
          maxLength: 100
        detail: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
        actor:
          type: integer
          nullable: true
      required:
      - action
      - created_at
      - id
      - object_id
      - object_type
    AuthRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          writeOnly: true
        email:
          type: string
          format: email
        first_name:
          type: string
    CartInput:
      type: object
      properties:
        variant:
          type: integer
          minimum: 1
        quantity:
          type: integer
          maximum: 99
          minimum: 0
      required:
      - quantity
      - variant
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
      required:
      - id
      - name
      - slug
    CategoryManagement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        active:
          type: boolean
      required:
      - id
      - name
      - slug
    Checkout:
      type: object
      properties:
        address:
          type: integer
          minimum: 1
        shipping:
          type: integer
          minimum: 1
        idempotency_key:
          type: string
          format: uuid
        coupon:
          type: string
          maxLength: 40
      required:
      - address
      - idempotency_key
      - shipping
    CouponManagement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 40
        kind:
          $ref: '#/components/schemas/KindEnum'
        value:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,0})?$
        minimum:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,0})?$
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        usage_limit:
          type: integer
          maximum: 2147483647
          minimum: 0
        per_user_limit:
          type: integer
          maximum: 2147483647
          minimum: 0
        active:
          type: boolean
      required:
      - code
      - ends_at
      - id
      - kind
      - starts_at
      - value
    FavoriteInput:
      type: object
      properties:
        product:
          type: integer
      required:
      - product
    Image:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        image:
          type: string
          format: uri
        alt:
          type: string
          maxLength: 180
        position:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - alt
      - id
      - image
    KindEnum:
      enum:
      - percent
      - fixed
      type: string
      description: |-
        * `percent` - درصدی
        * `fixed` - مبلغ ثابت
    Newsletter:
      type: object
      properties:
        email:
          type: string
          format: email
        consent:
          type: boolean
      required:
      - consent
      - email
    NotificationInput:
      type: object
      properties:
        id:
          type: integer
      required:
      - id
    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        status:
          $ref: '#/components/schemas/OrderStatusEnum'
        address: {}
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,0})?$
        discount:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,0})?$
        shipping:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,0})?$
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,0})?$
        shipping_name:
          type: string
          maxLength: 120
        tracking_code:
          type: string
          maxLength: 120
        created_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
        paid_at:
          type: string
          format: date-time
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          readOnly: true
        payment_state:
          type: string
          readOnly: true
        payment_provider:
          type: string
          readOnly: true
      required:
      - address
      - created_at
      - expires_at
      - id
      - items
      - payment_provider
      - payment_state
      - shipping
      - shipping_name
      - subtotal
      - total
    OrderItem:
      type: object
      properties:
        name:
          type: string
          maxLength: 180
        sku:
          type: string
          maxLength: 64
        weight_g:
          type: integer
          maximum: 2147483647
          minimum: 0
        quantity:
          type: integer
          maximum: 32767
          minimum: 0
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,0})?$
        line_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,0})?$
      required:
      - line_total
      - name
      - quantity
      - sku
      - unit_price
      - weight_g
    OrderStatusEnum:
      enum:
      - pending
      - paid
      - processing
      - shipped
      - delivered
      - cancelled
      - review
      type: string
      description: |-
        * `pending` - در انتظار پرداخت
        * `paid` - پرداخت‌شده
        * `processing` - در حال آماده‌سازی
        * `shipped` - ارسال‌شده
        * `delivered` - تحویل‌شده
        * `cancelled` - لغوشده
        * `review` - نیازمند بررسی مالی
    PaginatedAddressList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Address'
    PaginatedArticleList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Article'
    PaginatedArticleManagementList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
