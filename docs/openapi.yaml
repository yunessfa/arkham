openapi: 3.0.3
info:
  title: ARKHAM API
  version: 1.0.0
paths:
  /api/v1/accounts/{kind}/:
    post:
      operationId: accounts_create
      description: 'kind: login, register or logout. All requests require a CSRF cookie/header,
        including anonymous login. Registration requires all four fields.'
      parameters:
      - in: path
        name: kind
        schema:
          type: string
        required: true
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/addresses/:
    get:
      operationId: addresses_list
