server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 6m;
    add_header X-Content-Type-Options nosniff always;
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location /brand/ { try_files $uri =404; expires 7d; }
    location /fonts/ { try_files $uri =404; expires 30d; }
    location /docs/ { try_files $uri =404; }
    location /static/ { alias /static/; expires 7d; }
    location /media/ {
        alias /media/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }
    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # Only the trusted host TLS proxy may access this loopback-published service.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_read_timeout 65s;
    }
}
