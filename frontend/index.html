<style>
#boot{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#fbf4e5;color:#a56b31;transition:opacity .6s cubic-bezier(.22,1,.36,1),visibility .6s;animation:boot-out .5s 8s forwards}
html[data-design=noir_hive] #boot{background:#0b0b0b;color:#fbd46d}
#boot.is-done{opacity:0;visibility:hidden}#boot.is-done .boot-stage{transform:scale(.92);transition:transform .6s cubic-bezier(.22,1,.36,1)}
.boot-stage{position:relative;width:132px;height:132px;display:grid;place-items:center}
.boot-hex{stroke-dasharray:330;stroke-dashoffset:330;animation:boot-draw 1.1s cubic-bezier(.65,0,.35,1) forwards}
.boot-honey{transform:translateY(70px);animation:boot-fill 2.4s cubic-bezier(.45,0,.2,1) .35s forwards}
.boot-wave{animation:boot-wave 1.6s linear infinite}
.boot-orbit{position:absolute;inset:-14px;animation:boot-orbit 2.6s cubic-bezier(.45,.05,.55,.95) infinite}
.boot-bee{position:absolute;top:0;left:50%;width:30px;margin-left:-15px;transform:rotate(90deg)}
.boot-wing{transform-origin:50% 100%;transform-box:fill-box;animation:boot-flap 90ms ease-in-out infinite alternate}
.boot-word{font:13px/1 Georgia,serif;letter-spacing:.55em;margin-inline-start:.55em;opacity:0;animation:boot-text .8s .5s forwards}
.boot-line{width:120px;height:1px;background:currentColor;opacity:.25;position:relative;overflow:hidden}.boot-line::after{content:"";position:absolute;inset:0;background:currentColor;transform:scaleX(0);transform-origin:right;animation:boot-progress 2.2s cubic-bezier(.22,1,.36,1) .3s forwards}
@keyframes boot-draw{to{stroke-dashoffset:0}}@keyframes boot-fill{to{transform:translateY(8px)}}@keyframes boot-wave{to{transform:translateX(-40px)}}@keyframes boot-orbit{to{transform:rotate(360deg)}}@keyframes boot-flap{to{transform:scaleY(.35)}}@keyframes boot-text{to{opacity:1}}@keyframes boot-progress{to{transform:scaleX(1)}}@keyframes boot-out{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#boot *{animation-duration:.01ms!important;animation-iteration-count:1!important}}
